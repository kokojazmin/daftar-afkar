<style>
:root{--h:150;--bg:hsl(var(--h) 28% 93%);--card:#fff;--c1:hsl(var(--h) 26% 95.5%);--c2:hsl(var(--h) 20% 86%);--pri:hsl(var(--h) 38% 33%);--onp:#fff;--pc:hsl(var(--h) 42% 87%);--onpc:hsl(var(--h) 55% 11%);--sc:hsl(var(--h) 30% 90%);--tx:hsl(var(--h) 25% 10%);--tv:hsl(var(--h) 10% 31%);--ol:hsl(var(--h) 8% 50%);--ov:hsl(var(--h) 18% 85%);--er:#BA1A1A;--ring:hsl(var(--h) 40% 33%/.18);--sh1:0 1px 2px hsl(var(--h) 40% 15%/.06),0 10px 28px -10px hsl(var(--h) 40% 15%/.16);--sh2:0 2px 4px hsl(var(--h) 40% 15%/.06),0 18px 40px -12px hsl(var(--h) 40% 15%/.30);--shp:0 8px 20px -6px hsl(var(--h) 45% 33%/.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:hsl(var(--h) 20% 7%);--card:hsl(var(--h) 16% 11%);--c1:hsl(var(--h) 14% 15%);--c2:hsl(var(--h) 12% 21%);--pri:hsl(var(--h) 42% 72%);--onp:hsl(var(--h) 50% 12%);--pc:hsl(var(--h) 30% 22%);--onpc:hsl(var(--h) 50% 88%);--sc:hsl(var(--h) 22% 22%);--tx:hsl(var(--h) 12% 90%);--tv:hsl(var(--h) 8% 72%);--ol:hsl(var(--h) 6% 55%);--ov:hsl(var(--h) 12% 24%);--er:#FFB4AB;--ring:hsl(var(--h) 42% 72%/.22);--sh1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.75);--shp:0 8px 20px -6px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:hsl(var(--h) 20% 7%);--card:hsl(var(--h) 16% 11%);--c1:hsl(var(--h) 14% 15%);--c2:hsl(var(--h) 12% 21%);--pri:hsl(var(--h) 42% 72%);--onp:hsl(var(--h) 50% 12%);--pc:hsl(var(--h) 30% 22%);--onpc:hsl(var(--h) 50% 88%);--sc:hsl(var(--h) 22% 22%);--tx:hsl(var(--h) 12% 90%);--tv:hsl(var(--h) 8% 72%);--ol:hsl(var(--h) 6% 55%);--ov:hsl(var(--h) 12% 24%);--er:#FFB4AB;--ring:hsl(var(--h) 42% 72%/.22);--sh1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.75);--shp:0 8px 20px -6px rgba(0,0,0,.6)}
*{box-sizing:border-box;scrollbar-width:none}

body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.85 "Noto Sans Arabic",Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:120px}
main{max-width:680px;margin:0 auto;padding:20px 16px}

.h{color:var(--tv);font-size:14px;margin:0 0 10px}

.f{margin-top:16px}

textarea{width:100%;font:inherit;color:var(--tx);background:var(--c1);border:1.5px solid transparent;border-radius:18px;padding:14px 16px;resize:vertical;min-height:96px;line-height:1.85}
textarea::placeholder{color:var(--ol)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:14px;color:var(--tv);background:var(--c1);border:1px solid var(--ov);border-radius:999px;padding:5px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--onp);border-color:var(--pri);box-shadow:var(--shp)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip:focus-visible,.btn:focus-visible,.nav button:focus-visible,summary:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 14px;align-items:center;margin-top:16px}
.sl label{grid-column:1/-1;margin:0 0 4px;font-weight:400;color:var(--tv);font-size:14.5px}
.sl output{min-width:56px;text-align:center;font-weight:600;font-size:14px;color:var(--onpc);background:var(--sc);border-radius:999px;padding:1px 10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--card);border:6px solid var(--pri);box-shadow:0 3px 8px rgba(0,0,0,.28)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--c2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--pri)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--card);border:6px solid var(--pri);box-shadow:0 3px 8px rgba(0,0,0,.28)}
.hint{background:var(--c1);border-radius:16px;border-inline-start:4px solid var(--pri);padding:10px 14px;margin-top:12px;font-size:14px;color:var(--tv)}
.hint:empty{display:none}
.hint b{color:var(--tx);font-weight:600}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;height:54px;padding:0 32px;cursor:pointer;background:var(--pri);color:var(--onp);box-shadow:var(--shp)}
.btn.t{background:var(--card);color:var(--pri);height:44px;padding:0 20px;font-size:14px;box-shadow:var(--sh1)}
.btn.d{color:var(--er)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
#form .bar .btn{flex:1;min-width:220px}
.msg{font-size:14px;color:var(--er);margin:0}
.msg.ok{color:var(--pri)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));background:var(--card);border-radius:30px;padding:6px;display:flex;gap:4px;box-shadow:var(--sh2)}
.nav button{font:inherit;font-size:14px;font-weight:600;color:var(--tv);background:transparent;border:0;border-radius:24px;height:48px;flex:1;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.nav svg{width:20px;height:20px}
.nav button[aria-selected="true"]{background:var(--pri);color:var(--onp);box-shadow:var(--shp)}
.stats{display:flex;gap:10px;margin:16px 0}
.stat{flex:1;background:var(--card);border-radius:20px;padding:12px 14px;font-size:13px;color:var(--tv);line-height:1.6;box-shadow:var(--sh1)}
.stat b{display:block;font-size:26px;color:var(--pri);font-weight:700;line-height:1.4}
.day{font-size:14px;font-weight:600;margin:24px 6px 10px;color:var(--tv)}
details{background:var(--card);border-radius:24px;margin-bottom:10px;padding:0 18px;box-shadow:var(--sh1)}
details[open]{box-shadow:var(--sh2)}
summary{position:relative;list-style:none;cursor:pointer;padding:16px 0;padding-inline-end:26px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;inset-inline-end:4px;top:26px;width:8px;height:8px;border:solid var(--ol);border-width:0 2px 2px 0;transform:rotate(45deg)}
details[open] summary::after{transform:rotate(-135deg)}
.tm{font-size:13px;color:var(--tv)}
.th{margin:2px 0 8px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details[open] .th{display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--sc);color:var(--onpc);border-radius:999px;padding:0 12px;font-size:13px}
.det{padding-bottom:16px;border-top:1px solid var(--ov)}
.det p{margin:2px 0 0;white-space:pre-wrap}
.det .lb{margin-top:14px;color:var(--tv);font-size:14px;font-weight:500}
.empty{text-align:center;color:var(--tv);padding:48px 16px;background:var(--card);border-radius:28px;box-shadow:var(--sh1)}
select{width:100%;font:inherit;color:var(--tx);background:var(--c1);border:1.5px solid transparent;border-radius:18px;padding:12px 14px;margin-top:6px}
select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--ring)}
.ck{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:400;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--pri);margin:0}
#txT{min-height:220px;font-size:14px;margin-bottom:8px}
#txCard .bar .btn:first-child{flex:1;min-width:160px}
[hidden]{display:none!important}
.hero>.deco{position:absolute;top:14px;inset-inline-end:14px;width:128px;height:96px;color:var(--pri);pointer-events:none}
.deco svg,.ed svg{width:100%;height:100%;fill:currentColor;stroke:none}
.ed{width:132px;height:98px;margin:0 auto 10px;color:var(--pri)}
.pal{margin-top:16px;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--card);color:var(--pri);box-shadow:var(--sh1);cursor:pointer}
.pal svg{width:16px;height:16px}
#lng{margin-inline-start:8px}
:root[dir="ltr"]{--gd:right}
.pal:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
input[type=file]{display:none}
</style>
</head>
<body>
<main>
<section id="vNew">
<div class="hero"><div class="deco" id="dec"></div><div class="brand"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><h1 data-t="دفتر افکار">دفتر افکار</h1><p data-t="وقتی فکری آزارت می‌دهد، آن را از ذهن به کاغذ بیاور و قدم‌به‌قدم بررسی‌اش کن. نه لازم است همه بخش‌ها کامل باشد، نه لازم است جواب «درست» پیدا کنی.">وقتی فکری آزارت می‌دهد، آن را از ذهن به کاغذ بیاور و قدم‌به‌قدم بررسی‌اش کن. نه لازم است همه بخش‌ها کامل باشد، نه لازم است جواب «درست» پیدا کنی.</p><button class="pal" id="pal" type="button" aria-label="تغییر پالت رنگ"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span id="palN"></span></button><button class="pal" id="lng" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span id="lngN"></span></button></div>
<form id="form" autocomplete="off"></form>
</section>
<section id="vHist" hidden>

<div id="list"></div>
<div class="card" id="txCard">

<script>
const $=s=>document.querySelector(s),KEY='cbt_records_v1',DK='cbt_draft_v1';
const pt=r=>r.style.setProperty('--p',r.value+'%'),ptAll=()=>document.querySelectorAll('input[type=range]').forEach(pt);
const fa=n=>Number(n).toLocaleString(LG=='en'?'en-US':'fa-IR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};

const RAW={"اضطراب": "Anxiety", "نگرانی": "Worry", "ترس": "Fear", "استرس": "Stress", "غم": "Sadness", "ناامیدی": "Hopelessness", "درماندگی": "Helplessness", "خشم": "Anger", "احساس گناه": "Guilt", "شرم": "Shame", "تنهایی": "Loneliness", "ناکامی": "Frustration", "خستگی ذهنی": "Mental fatigue", "ذهن‌خوانی": "Mind reading", "فرض می‌کنم می‌دانم دیگران درباره‌ام چه فکری می‌کنند.": "I assume I know what others think about me.", "پیشگویی": "Fortune telling", "مطمئنم که آینده بد خواهد شد.": "I’m sure the future will turn out badly.", "فاجعه‌سازی": "Catastrophizing", "بدترین حالت ممکن را حتمی و غیرقابل‌تحمل می‌بینم.": "I see the worst case as certain and unbearable.", "همه‌یا‌هیچ": "All-or-nothing", "فقط سیاه یا سفید می‌بینم؛ یا کامل، یا شکست.": "I see only black or white: perfect or a failure.", "تعمیم افراطی": "Overgeneralizing", "یک اتفاق را به «همیشه» یا «هیچ‌وقت» تعمیم می‌دهم.": "I stretch one event into “always” or “never”.", "برچسب‌زنی": "Labeling", "به‌جای توصیف رفتار، به خودم یا دیگری برچسب می‌زنم.": "Instead of describing behavior, I label myself or someone else.", "باید و نباید": "Should statements", "با «باید»ها و «نباید»های سخت‌گیرانه خودم را تحت فشار می‌گذارم.": "I pressure myself with harsh “shoulds” and “musts”.", "استدلال احساسی": "Emotional reasoning", "چون چنین حسی دارم، پس حتماً حقیقت دارد.": "Because I feel this way, it must be true.", "شخصی‌سازی": "Personalizing", "همه‌چیز را تقصیر یا مسئولیت خودم می‌دانم.": "I treat everything as my fault or responsibility.", "فیلتر منفی": "Negative filter", "فقط جنبه‌های منفی را می‌بینم و مثبت‌ها را نادیده می‌گیرم.": "I see only the negatives and dismiss the positives.", "موقعیت": "Situation", "چه اتفاقی افتاد؟ کجا بودی، چه زمانی، با چه کسی، و درباره چه چیزی فکر می‌کردی؟ فقط واقعیت‌های قابل مشاهده را بنویس، نه تفسیر.": "What happened? Where were you, when, with whom, and what were you thinking about? Write only observable facts, not interpretations.", "مثلاً: شب، تنها در خانه، پیام مدیرم را دیدم و جواب نداده بودم…": "e   else if(/^ea\d/.test(t.id))emo[k[t.id.slice(2)]].a=+t.value;
 }
 draft();
});
function rEmoA(){
 Object.keys(emo).forEach((k,i)=>{const r=$('#ea'+i);if(r&&emo[k].a===undefined){r.value=emo[k].b;pt(r);r.nextElementSibling.textContent=fa(emo[k].b)+PS}});
}
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()};
F.addEventListener('submit',e=>{
 e.preventDefault();const r=collect(),m=$('#fm');m.className='msg';
 if(!r.sit||!r.thought||!r.emo.length){m.textContent=T('موقعیت، فکر خودکار و دست‌کم یک احساس را پر کن.');return}
 r.id=Date.now();r.ts=new Date().toISOString();recs.unshift(r);
 const ok=st(KEY,recs);
 F.reset();emo={};dis=[];document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
 rEmo();rDis();['bb','ba'].forEach(i=>{$('#'+i).value=80;$('#'+i).nextElementSibling.textContent=fa(80)+PS});
 $('#bl').value=50;$('#bl').nextElementSibling.textContent=fa(50)+PS;ptAll();
 try{localStorage.removeItem(DK)}catch(x){}
 show('H');$('#hm').className=ok?'msg ok':'msg';$('#hm').textContent=ok?T('ثبت ذخیره شد.'):T('ذخیره‌سازی مرورگر در دسترس نیست؛ همین حالا از سوابق خروجی پشتیبان بگیر.');
});
const dfmt=d=>new Intl.DateTimeFormat(LG=='en'?'en-US':'fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(d));
const tfmt=d=>new Intl.DateTimeFormat(LG=='en'?'en-US':'fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const pr=(l,v)=>v?`<div class="lb">${l}</div><p dir="auto">${esc(v)}</p>`:'';
function rHist(){
 const L=$('#list');$('#txCard').hidden=!recs.length;
 if(!recs.length){L.innerHTML='<div class="empty"><div class="ed">'+DEC+'</div>'+T('هنوز ثبتی نداری. اولین فکرت را در «ثبت جدید» بنویس.')+'</div>';$('#stats').innerHTML='';return}
 const days={};recs.forEach(r=>(days[dkey(r.ts)]??=[]).push(r));
 const today=dkey(Date.now());let s=0,d=new Date();if(!days[dkey(d)])d.setDate(d.getDate()-1);
 while(days[dkey(d)]){s++;d.setDate(d.getDate()-1)}
 $('#stats').innerHTML=`<div class="stat"><b>${fa((days[today]||[]).length)}</b>${T('ثبت امروز')}</div><div class="stat"><b>${fa(s)}</b>${T('روز پیاپی')}</div><div class="stat"><b>${fa(recs.length)}</b>${T('کل ثبت‌ها')}</div>`;
 L.innerHTML=Object.keys(days).map(k=>`<div class="day">${k==today?T('امروز، '):''}${dfmt(days[k][0].ts)}</div>`+days[k].map(r=>{
  const ch=r.ba!=null&&r.bb!=null?` · ${T('باور به فکر')}: ${fa(r.bb)}${PS} ${AR} ${fa(r.ba)}${PS}`:'';
  return `<details><summary><div class="tm">${tfmt(r.ts)}${ch}</div><div class="th" dir="auto">${esc(r.thought)}</div><div class="tags">${r.emo.map(e=>`<span class="tag">${esc(T(e.n))} ${fa(e.b)} ${AR} ${fa(e.a)}</span>`).join('')}</div></summary><div class="det">${pr(T('موقعیت'),r.sit)}${pr(T('فکر متعادل'),r.bal)}${r.dis.length?`<div class="lb">${T('تله‌های فکری')}</div><div class="tags">${r.dis.map(x=>`<span class="tag">${esc(T(x))}</span>`).join('')}</div>`:''}${pr(T('شواهد موافق'),r.evf)}${pr(T('شواهد مخالف'),r.eva)}${pr(T('نگاه یک دوست'),r.friend)}${pr(T('بدترین، بهترین، محتمل‌ترین'),r.worst)}${pr(T('در کنترل من'),r.ctrl)}${r.bl!=null&&r.bal?`<div class="lb">${T('باور به فکر متعادل')}</div><p>${fa(r.bl)}${PS}</p>`:''}<div class="bar"><button class="btn t d" type="button" data-del="${r.id}">${T('حذف')}</button></div></div></details>`}).join('')).join('');gen();
}
$('#list').addEventListener('click',e=>{
 const b=e.target.closest('[data-del]');if(!b)return;
 if(!b.dataset.s){b.dataset.s=1;b.textContent=T('مطمئنی؟ دوباره بزن');return}
 recs=recs.filter(r=>r.id!=b.dataset.del);st(KEY,recs);rHist();

function show(v){
 $('#vNew').hidden=v!='N';$('#vHist').hidden=v!='H';
 $('#tNew').setAttribute('aria-selected',v=='N');$('#tHist').setAttribute('aria-selected',v=='H');

$('#exp').onclick=async()=>{
 const m=$('#hm');m.className='msg';
 if(!recs.length){m.textContent=T('هنوز ثبتی برای خروجی نیست.');return}
 const n='thought-records-'+dkey(Date.now())+'.json',blob=new Blob([JSON.stringify(recs,null,2)],{type:'application/json'});
 try{
  const dl=null;
  if(dl){await dl.save({filename:n,data:blob});m.className='msg ok';m.textContent=T('فایل پشتیبان آماده شد.')}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();m.className='msg ok';m.textContent=T('فایل پشتیبان در پوشه Downloads ذخیره شد.')}
 }catch(x){m.textContent=x&&x.code=='declined'?T('ذخیره فایل لغو شد.'):T('در این محیط دانلود ممکن نیست.')}
};

const AI='این‌ها ثبت‌های من از تمرین «ثبت افکار» در رویکرد شناختی‑رفتاری (CBT) است. لطفاً با نگاهی همدلانه و غیرقضاوتی: (۱) الگوهای تکرارشونده در افکار و محرک‌های من را پیدا کن، (۲) تله‌های فکری پرتکرارم را نام ببر، (۳) فکرهای متعادلی را که نوشته‌ام بازبینی و در صورت نیاز دقیق‌تر کن، و (۴) چند تمرین کوچک و عملی برای نشخوار ذهنی و اضطرابم پیشنهاد بده. توجه: تو جایگزین درمانگر نیستی و اگر نشانه‌ای از خطر دیدی، مرا به کمک حرفه‌ای راهنمایی کن.';
const AIE='Here are my entries from a CBT “thought record” practice. Please respond with empathy and without judgment: (1) find recurring patterns in my thoughts and triggers, (2) name my most frequent thinking traps, (3) review the balanced thoughts I wrote and refine them if needed, and (4) suggest a few small, practical exercises for my rumination and anxiety. Note: you are not a replacement for a therapist; if you notice any sign of risk, guide me toward professional help.';
const q=(l,v)=>v?T(l)+':\n'+v+'\n\n':'';
function gen(){
 const n=+$('#txR').value;let a=recs.slice().sort((x,y)=>x.id-y.id);
 if(n){const c=new Date();c.setHours(0,0,0,0);c.setDate(c.getDate()-(n-1));a=a.filter(r=>new Date(r.ts)>=c)}
 const bl=(x,y)=>'\n('+T('میزان باور')+': '+fa(x)+PS+(y!=null?' '+AR+' '+fa(y)+PS+' '+T('پس از بررسی'):'')+')';
 let t=$('#txA').checked?(LG=='en'?AIE:AI)+'\n\n————————————————\n\n':'';
 t+=T('دفتر افکار (ثبت افکار CBT)')+'\n'+T('بازه')+': '+$('#txR').selectedOptions[0].textContent+'\n'+T('تعداد ثبت')+': '+fa(a.length)+'\n';
 if(!a.length)t+='\n'+T('در این بازه ثبتی وجود ندارد.')+'\n';
 a.forEach((r,i)=>{
  t+='\n————————————————\n'+T('ثبت')+' '+fa(i+1)+' | '+dfmt(r.ts)+T('، ساعت ')+tfmt(r.ts)+'\n\n'
  +q('موقعیت',r.sit)
  +q('احساس‌ها (شدت قبل ← بعد)',r.emo.map(e=>T(e.n)+' '+fa(e.b)+PS+' '+AR+' '+fa(e.a)+PS).join(T('، ')))
  +q('فکر خودکار',r.thought+(r.bb!=null?bl(r.bb,r.ba):''))
  +q('تله‌های فکری',r.dis.map(x=>T(x)).join(T('، ')))
  +q('شواهد موافق فکر',r.evf)+q('شواهد مخالف فکر',r.eva)
  +q('اگر دوستم بود چه می‌گفتم',r.friend)
  +q('بدترین، بهترین و محتمل‌ترین نتیجه',r.worst)
  +q('چه چیزی در کنترل من است / قدم عملی',r.ctrl)
  +q('فکر متعادل',r.bal+(r.bal&&r.bl!=null?bl(r.bl):''));
 });
 $('#txT').value=t.trim().replace(/←/g,AR);$('#txM').textContent='';
}
$('#txR').onchange=gen;$('#txA').onchange=gen;
$('#txC').onclick=async()=>{

 m.className=ok?'msg ok':'msg';m.textContent=ok?T('متن کپی شد.'):T('کپی خودکار ممکن نشد؛ متن انتخاب شد، با Ctrl+C یا نگه‌داشتن انگشت کپی کن.');

  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();m.className='msg ok';m.textContent=T('فایل متنی در پوشه Downloads ذخیره شد.')}
 }catch(x){m.textContent=x&&x.code=='declined'?T('ذخیره فایل لغو شد.'):T('در این محیط دانلود ممکن نیست.')}
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
 const f=e.target.files[0],m=$('#hm');if(!f)return;m.className='msg';
 const rd=new FileReader();
 rd.onload=()=>{
  try{
   const a=JSON.parse(rd.result);if(!Array.isArray(a))throw 0;
   const ids=new Set(recs.map(r=>r.id));let n=0;
   a.forEach(r=>{if(r&&r.id&&r.ts&&r.thought&&Array.isArray(r.emo)&&!ids.has(r.id)){r.dis=r.dis||[];recs.push(r);n++}});
   recs.sort((x,y)=>y.id-x.id);st(KEY,recs);rHist();m.className='msg ok';m.textContent=fa(n)+T(' ثبت جدید بازیابی شد.');
  }catch(x){m.textContent=T('فایل معتبر نیست.')}
 };
 rd.readAsText(f);e.target.value='';
};
function restore(){
 const d=ld(DK);if(!d)return;
 TF.forEach(k=>{if(d[k])$('#'+k).value=d[k]});
 ['bb','bl','ba'].forEach(k=>{if(d[k]!=null){$('#'+k).value=d[k];$('#'+k).nextElementSibling.textContent=fa(d[k])+PS}});
 emo=d.raw||{};dis=d.dis||[];
 document.querySelectorAll('[data-e]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.e in emo));
