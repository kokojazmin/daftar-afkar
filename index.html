<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="دفتر افکار">دفتر افکار</title>
<style>
:root{--h:150;--sh:var(--sh1);--bg:hsl(var(--h) 28% 93%);--card:#fff;--c1:hsl(var(--h) 26% 95.5%);--c2:hsl(var(--h) 20% 86%);--pri:hsl(var(--h) 38% 33%);--onp:#fff;--pc:hsl(var(--h) 42% 87%);--onpc:hsl(var(--h) 55% 11%);--sc:hsl(var(--h) 30% 90%);--tx:hsl(var(--h) 25% 10%);--tv:hsl(var(--h) 10% 31%);--ol:hsl(var(--h) 8% 50%);--ov:hsl(var(--h) 18% 85%);--er:#BA1A1A;--ring:hsl(var(--h) 40% 33%/.18);--sh1:0 1px 2px hsl(var(--h) 40% 15%/.06),0 10px 28px -10px hsl(var(--h) 40% 15%/.16);--sh2:0 2px 4px hsl(var(--h) 40% 15%/.06),0 18px 40px -12px hsl(var(--h) 40% 15%/.30);--shp:0 8px 20px -6px hsl(var(--h) 45% 33%/.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:hsl(var(--h) 20% 7%);--card:hsl(var(--h) 16% 11%);--c1:hsl(var(--h) 14% 15%);--c2:hsl(var(--h) 12% 21%);--pri:hsl(var(--h) 42% 72%);--onp:hsl(var(--h) 50% 12%);--pc:hsl(var(--h) 30% 22%);--onpc:hsl(var(--h) 50% 88%);--sc:hsl(var(--h) 22% 22%);--tx:hsl(var(--h) 12% 90%);--tv:hsl(var(--h) 8% 72%);--ol:hsl(var(--h) 6% 55%);--ov:hsl(var(--h) 12% 24%);--er:#FFB4AB;--ring:hsl(var(--h) 42% 72%/.22);--sh1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.75);--shp:0 8px 20px -6px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:hsl(var(--h) 20% 7%);--card:hsl(var(--h) 16% 11%);--c1:hsl(var(--h) 14% 15%);--c2:hsl(var(--h) 12% 21%);--pri:hsl(var(--h) 42% 72%);--onp:hsl(var(--h) 50% 12%);--pc:hsl(var(--h) 30% 22%);--onpc:hsl(var(--h) 50% 88%);--sc:hsl(var(--h) 22% 22%);--tx:hsl(var(--h) 12% 90%);--tv:hsl(var(--h) 8% 72%);--ol:hsl(var(--h) 6% 55%);--ov:hsl(var(--h) 12% 24%);--er:#FFB4AB;--ring:hsl(var(--h) 42% 72%/.22);--sh1:0 1px 2px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.75);--shp:0 8px 20px -6px rgba(0,0,0,.6)}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.85 "Noto Sans Arabic",Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:120px}
main{max-width:680px;margin:0 auto;padding:20px 16px}
h1{font-size:28px;font-weight:700;margin:0 0 6px;line-height:1.5}
h2{font-size:18px;font-weight:600;margin:0 0 4px;line-height:1.6;display:flex;align-items:center;gap:12px}
.hero{position:relative;overflow:hidden;background:var(--pc);color:var(--onpc);border-radius:32px;padding:26px 24px;margin-bottom:16px;box-shadow:var(--sh1)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:var(--pri);opacity:.1}
.hero::before{width:190px;height:190px;inset-inline-end:-60px;top:-70px}
.hero::after{width:110px;height:110px;inset-inline-start:-30px;bottom:-50px}
.hero>*{position:relative}
.hero p{margin:0;font-size:15px;opacity:.88}
.brand{width:52px;height:52px;border-radius:18px;background:var(--pri);color:var(--onp);display:grid;place-items:center;margin-bottom:14px;box-shadow:var(--shp)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:28px;padding:22px;margin-bottom:16px;box-shadow:var(--sh1)}
.num{flex:none;width:32px;height:32px;line-height:32px;text-align:center;border-radius:12px;background:var(--pri);color:var(--onp);font-size:15px;font-weight:600;box-shadow:var(--shp)}
.h{color:var(--tv);font-size:14px;margin:0 0 10px}
h2+.h{margin-top:8px}
.f{margin-top:16px}
label,.lb{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
textarea{width:100%;font:inherit;color:var(--tx);background:var(--c1);border:1.5px solid transparent;border-radius:18px;padding:14px 16px;resize:vertical;min-height:96px;line-height:1.85}
textarea::placeholder{color:var(--ol)}
textarea:focus{outline:0;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px var(--ring)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:14px;color:var(--tv);background:var(--c1);border:1px solid var(--ov);border-radius:999px;padding:5px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pri);color:var(--onp);border-color:var(--pri);box-shadow:var(--shp)}
.chip[aria-pressed="true"]::before{content:"✓ "}
.chip:focus-visible,.btn:focus-visible,.nav button:focus-visible,summary:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 14px;align-items:center;margin-top:16px}
.sl label{grid-column:1/-1;margin:0 0 4px;font-weight:400;color:var(--tv);font-size:14.5px}
.sl output{min-width:56px;text-align:center;font-weight:600;font-size:14px;color:var(--onpc);background:var(--sc);border-radius:999px;padding:1px 10px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to var(--gd,left),var(--pri) var(--p,50%),var(--c2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--card);border:6px solid var(--pri);box-shadow:0 3px 8px rgba(0,0,0,.28)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--c2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--pri)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--card);border:6px solid var(--pri);box-shadow:0 3px 8px rgba(0,0,0,.28)}
.hint{background:var(--c1);border-radius:16px;border-inline-start:4px solid var(--pri);padding:10px 14px;margin-top:12px;font-size:14px;color:var(--tv)}
.hint:empty{display:none}
.hint b{color:var(--tx);font-weight:600}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;height:54px;padding:0 32px;cursor:pointer;background:var(--pri);color:var(--onp);box-shadow:var(--shp)}
.btn.t{background:var(--card);color:var(--pri);height:44px;padding:0 20px;font-size:14px;box-shadow:var(--sh1)}
.btn.d{color:var(--er)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
#form .bar .btn{flex:1;min-width:220px}
.msg{font-size:14px;color:var(--er);margin:0}
.msg.ok{color:var(--pri)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));background:var(--card);border-radius:30px;padding:6px;display:flex;gap:4px;box-shadow:var(--sh2)}
.nav button{font:inherit;font-size:14px;font-weight:600;color:var(--tv);background:transparent;border:0;border-radius:24px;height:48px;flex:1;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.nav svg{width:20px;height:20px}
.nav button[aria-selected="true"]{background:var(--pri);color:var(--onp);box-shadow:var(--shp)}
.stats{display:flex;gap:10px;margin:16px 0}
.stat{flex:1;background:var(--card);border-radius:20px;padding:12px 14px;font-size:13px;color:var(--tv);line-height:1.6;box-shadow:var(--sh1)}
.stat b{display:block;font-size:26px;color:var(--pri);font-weight:700;line-height:1.4}
.day{font-size:14px;font-weight:600;margin:24px 6px 10px;color:var(--tv)}
details{background:var(--card);border-radius:24px;margin-bottom:10px;padding:0 18px;box-shadow:var(--sh1)}
details[open]{box-shadow:var(--sh2)}
summary{position:relative;list-style:none;cursor:pointer;padding:16px 0;padding-inline-end:26px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;inset-inline-end:4px;top:26px;width:8px;height:8px;border:solid var(--ol);border-width:0 2px 2px 0;transform:rotate(45deg)}
details[open] summary::after{transform:rotate(-135deg)}
.tm{font-size:13px;color:var(--tv)}
.th{margin:2px 0 8px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details[open] .th{display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--sc);color:var(--onpc);border-radius:999px;padding:0 12px;font-size:13px}
.det{padding-bottom:16px;border-top:1px solid var(--ov)}
.det p{margin:2px 0 0;white-space:pre-wrap}
.det .lb{margin-top:14px;color:var(--tv);font-size:14px;font-weight:500}
.empty{text-align:center;color:var(--tv);padding:48px 16px;background:var(--card);border-radius:28px;box-shadow:var(--sh1)}
select{width:100%;font:inherit;color:var(--tx);background:var(--c1);border:1.5px solid transparent;border-radius:18px;padding:12px 14px;margin-top:6px}
select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--ring)}
.ck{display:flex;align-items:center;gap:10px;margin:14px 0;font-weight:400;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--pri);margin:0}
#txT{min-height:220px;font-size:14px;margin-bottom:8px}
#txCard .bar .btn:first-child{flex:1;min-width:160px}
[hidden]{display:none!important}
.hero>.deco{position:absolute;top:14px;inset-inline-end:14px;width:128px;height:96px;color:var(--pri);pointer-events:none}
.deco svg,.ed svg{width:100%;height:100%;fill:currentColor;stroke:none}
.ed{width:132px;height:98px;margin:0 auto 10px;color:var(--pri)}
.pal{margin-top:16px;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--card);color:var(--pri);box-shadow:var(--sh1);cursor:pointer}
.pal svg{width:16px;height:16px}
#lng{margin-inline-start:8px}
:root[dir="ltr"]{--gd:right}
.pal:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
input[type=file]{display:none}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px}
.tab,.bt,.opt,.fc{font:inherit;cursor:pointer;border:0}
#tabs .tab{flex:none;font-size:14px;font-weight:500;color:var(--tv);background:var(--card);border-radius:999px;padding:4px 18px;box-shadow:var(--sh1);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pri);color:var(--onp);box-shadow:var(--shp)}
.doc{background:var(--card);border-radius:28px;padding:22px;box-shadow:var(--sh1);margin-bottom:16px}
#view .tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
#view .bt{font-size:13px;font-weight:500;color:var(--pri);background:var(--c1);border-radius:999px;padding:3px 14px;box-shadow:var(--sh1)}
.bt.p{background:var(--pri);color:var(--onp);box-shadow:var(--shp)}
#view .bt.d{color:var(--er)}
.ti,.c-in input{font:inherit;color:var(--tx);background:var(--c1);border:1.5px solid transparent;border-radius:18px;padding:10px 14px}
#view .ti{flex:1;min-width:140px;font-weight:600}
#view .c-in input{width:100%}
.ti:focus,.c-in input:focus{outline:0;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px var(--ring)}
#view .pr{min-height:200px;font-size:12.5px;direction:ltr;text-align:left}
#view .je{font-size:13px;direction:ltr;text-align:left}
#view .dz{border:2px dashed var(--pri);border-radius:24px;padding:38px 16px;text-align:center;cursor:pointer;color:var(--tv);background:var(--c1)}
#view .dz.on{background:var(--sc)}
#view .dz b{display:block;color:var(--pri);font-size:18px}
#view .er{color:var(--er);font-size:14px;margin:8px 0}
#view .er ul{margin:4px 0;padding-inline-start:20px}
#view .c-t{margin:.5em 0}
#view .c-l{margin:.5em 0;padding-inline-start:24px}
#view .c-f{background:var(--c1);border-radius:18px;padding:14px;margin:12px 0;text-align:center}
#view .fm{font:italic 19px/1.8 Georgia,serif;direction:ltr;overflow-x:auto}
#view .c-f small{color:var(--tv);display:block}
#view .c-c{background:var(--c1);border-radius:16px;padding:12px;overflow-x:auto;font-size:13.5px;margin:12px 0}
#view .c-i{margin:12px 0}
#view .c-i img{max-width:100%;border-radius:18px}
#view .c-i figcaption{font-size:13px;color:var(--tv)}
#view .c-tb{overflow-x:auto;margin:12px 0}
#view table{border-collapse:collapse;width:100%}
#view th{background:var(--sc);text-align:start}
#view th,#view td{padding:6px 12px;border-bottom:1px solid var(--c2)}
#view .c-ch{margin:12px 0;color:var(--pri)}
#view .c-ch svg{width:100%;max-width:460px;display:block;margin:auto}
#view .c-q{margin:14px 0}
#view .opt{display:block;width:100%;text-align:start;background:var(--c1);color:var(--tx);border-radius:14px;padding:8px 14px;margin:6px 0}
#view .opt.ok{background:hsl(145 45% 82%);color:#0a2e1a}
#view .opt.bad{background:hsl(0 70% 88%);color:#5c0a0a}
#view .ex{font-size:14px;color:var(--tv);margin:4px 0}
#view .fc{display:block;width:100%;min-height:110px;background:var(--sc);color:var(--tx);border-radius:22px;padding:16px;margin:12px 0;font-size:17px}
#view .fc small{display:block;color:var(--tv);font-size:12px}
#view .call{border-inline-start:4px solid var(--pri);background:var(--c1);border-radius:14px;padding:10px 14px;margin:12px 0}


#view .c-in{display:block;margin:12px 0}
#view .c-in span{font-weight:500;font-size:15px}
#view .c-s{border:1px solid var(--c2);border-radius:22px;padding:6px 16px;margin:14px 0}
#view .ew{border:1.5px dashed var(--c2);border-radius:18px;padding:8px 10px;margin:10px 0}
#view .et{display:flex;gap:6px;align-items:center;margin-bottom:4px}
#view .et span{flex:1;font-size:12px;color:var(--tv)}
.gbar{display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px}.gbar .pal{margin:0}#lng{margin-inline-start:0}
#msg{margin:0 0 8px}

#view{--tc:var(--pri)}
#view .tn-primary{--tc:var(--pri)}#view .tn-success{--tc:hsl(145 45% 34%)}#view .tn-warn{--tc:hsl(30 85% 40%)}#view .tn-danger{--tc:hsl(2 65% 46%)}#view .tn-info{--tc:hsl(210 65% 44%)}#view .tn-muted{--tc:var(--ol)}

:root[data-theme="dark"] #view .tn-success{--tc:hsl(145 45% 62%)}:root[data-theme="dark"] #view .tn-warn{--tc:hsl(35 85% 62%)}:root[data-theme="dark"] #view .tn-danger{--tc:hsl(2 80% 72%)}:root[data-theme="dark"] #view .tn-info{--tc:hsl(210 75% 70%)}
#view .al-center{text-align:center}#view .al-end{text-align:end}#view .sz-sm{font-size:.875em}#view .sz-lg{font-size:1.25em}
#view .c-t{white-space:pre-wrap}#view a{color:var(--pri)}#view .call{border-inline-start-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--card))}#view .call b{display:block}
#view .c-g{display:grid;gap:12px;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));margin:12px 0}

#view .c-card{border:1px solid var(--c2);border-top:4px solid var(--tc);border-radius:22px;padding:6px 18px 10px;background:var(--card)}
#view .c-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
#view .st{background:color-mix(in srgb,var(--tc) 10%,var(--card));border-radius:20px;padding:10px 14px}#view .st small{color:var(--tv)}#view .st b{display:block;font-size:26px;color:var(--tc);line-height:1.4}#view .st i{font-style:normal;font-size:13px;color:var(--tc)}
#view .c-pg{margin:12px 0}#view .pgb{height:10px;border-radius:99px;background:var(--c2);overflow:hidden}#view .pgb i{display:block;height:100%;background:var(--tc);border-radius:99px}
#view .tags[class*=tn-] .tag{background:color-mix(in srgb,var(--tc) 18%,var(--card));color:var(--tc)}

#view .spc{height:16px}#view .spc.sz-sm{height:6px}#view .spc.sz-lg{height:40px}

#view .c-c2 small{color:var(--tv);display:block;margin-top:8px}#view .str tbody tr:nth-child(even){background:var(--c1)}#view caption{color:var(--tv);font-size:13px;padding:4px}

const RAW={"اضطراب": "Anxiety", "نگرانی": "Worry", "ترس": "Fear", "استرس": "Stress", "غم": "Sadness", "ناامیدی": "Hopelessness", "درماندگی": "Helplessness", "خشم": "Anger", "احساس گناه": "Guilt", "شرم": "Shame", "تنهایی": "Loneliness", "ناکامی": "Frustration", "خستگی ذهنی": "Mental fatigue", "ذهن‌خوانی": "Mind reading", "فرض می‌کنم می‌دانم دیگران درباره‌ام چه فکری می‌کنند.": "I assume I know what others think about me.", "پیشگویی": "Fortune telling", "مطمئنم که آینده بد خواهد شد.": "I’m sure the future will turn out badly.", "فاجعه‌سازی": "Catastrophizing", "بدترین حالت ممکن را حتمی و غیرقابل‌تحمل می‌بینم.": "I see the worst case as certain and unbearable.", "همه‌یا‌هیچ": "All-or-nothing", "فقط سیاه یا سفید می‌بینم؛ یا کامل، یا شکست.": "I see only black or white: perfect or a failure.", "تعمیم افراطی": "Overgeneralizing", "یک اتفاق را به «همیشه» یا «هیچ‌وقت» تعمیم می‌دهم.": "I stretch one event into “always” or “never”.", "برچسب‌زنی": "Labeling", "به‌جای توصیف رفتار، به خودم یا دیگری برچسب می‌زنم.": "Instead of describing behavior, I label myself or someone else.", "باید و نباید": "Should statements", "با «باید»ها و «نباید»های سخت‌گیرانه خودم را تحت فشار می‌گذارم.": "I pressure myself with harsh “shoulds” and “musts”.", "استدلال احساسی": "Emotional reasoning", "چون چنین حسی دارم، پس حتماً حقیقت دارد.": "Because I feel this way, it must be true.", "شخصی‌سازی": "Personalizing", "همه‌چیز را تقصیر یا مسئولیت خودم می‌دانم.": "I treat everything as my fault or responsibility.", "فیلتر منفی": "Negative filter", "فقط جنبه‌های منفی را می‌بینم و مثبت‌ها را نادیده می‌گیرم.": "I see only the negatives and dismiss the positives.", "موقعیت": "Situation", "چه اتفاقی افتاد؟ کجا بودی، چه زمانی، با چه کسی، و درباره چه چیزی فکر می‌کردی؟ فقط واقعیت‌های قابل مشاهده را بنویس، نه تفسیر.": "What happened? Where were you, when, with whom, and what were you thinking about? Write only observable facts, not interpretations.", "مثلاً: شب، تنها در خانه، پیام مدیرم را دیدم و جواب نداده بودم…": "e.g. Night, alone at home, I saw my manager’s message and hadn’t replied…", "احساس‌ها": "Emotions", "همین الان چه حس‌هایی داری؟ هر چند تا را که می‌شناسی انتخاب کن و شدت هرکدام را بسنج.": "What are you feeling right now? Pick as many as apply and rate how strong each one is.", "فکر خودکار": "Automatic thought", "اولین فکر یا تصویری که پیش از آن حس‌ها از ذهنت گذشت چه بود؟ آن را مثل یک جمله بنویس، نه یک سؤال.": "What was the first thought or image that crossed your mind before those feelings? Write it as a statement, not a question.", "مثلاً: «حتماً کارم را بد انجام داده‌ام و دیگر بهم اعتماد نمی‌کنند.»": "e.g. “I must have done a bad job and they won’t trust me anymore.”", "الان چقدر این فکر را باور داری؟": "How much do you believe this thought right now?", "تله‌های فکری": "Thinking traps", "این فکر با کدام الگوهای رایج ذهن نگران شباهت دارد؟ می‌توانی هیچ‌کدام یا چند مورد را انتخاب کنی.": "Which common patterns of an anxious mind does this thought resemble? Choose none, or several.", "شواهد": "Evidence", "فرق «واقعیت» با «حدس یا احساس» را نگه دار. شواهد باید چیزی باشد که یک ناظر بی‌طرف هم تأیید کند.": "Keep “fact” separate from “guess or feeling”. Evidence should be something a neutral observer would also confirm.", "شواهدی که فکر را تأیید می‌کند": "Evidence that supports the thought", "چه واقعیت‌هایی نشان می‌دهد این فکر درست است؟": "What facts suggest this thought is true?", "شواهدی که فکر را زیر سؤال می‌برد": "Evidence that challenges the thought", "چه چیزی را نادیده می‌گیرم؟ آیا زمانی بوده که این فکر درست از آب درنیامد؟ چه چیزی مخالف آن است؟": "What am I overlooking? Has there been a time this thought turned out wrong? What contradicts it?", "نگاه از زاویه‌های دیگر": "Other angles", "برای شکستن نشخوار ذهنی، بحث را از دایره یک فکر بیرون ببر.": "To break the rumination loop, step outside the circle of one single thought.", "اگر دوست صمیمی‌ام همین فکر را داشت…": "If my close friend had this same thought…", "به او چه می‌گفتم؟ با خودم هم همان‌قدر مهربان هستم؟": "What would
